$kind: http-request
name: Get Notification Detail
url: '{{base_url}}/api/v1/notifications/{{notification_id}}'
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Response has deliveries", function () {
        const json = pm.response.json();
        pm.expect(String(json.id)).to.eql(String(pm.environment.get("notification_id")));
        pm.expect(json.deliveries).to.be.an("array");
      });
    language: text/javascript
order: 1000000000003
